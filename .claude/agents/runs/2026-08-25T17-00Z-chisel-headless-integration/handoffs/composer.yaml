redispatch_r02_multiline_fix:
  # Re-dispatch trigger: DECISIONS.md 2026-08-26T13:15Z entry — "Every multiline/rich-text field returns
  # {"html": null} in the live GraphQL payload... while scalar fields on the same fragments are correct."
  # This section resolves COMPOSER-OQ-04 above (originally flagged as an unverifiable-in-session risk;
  # now root-caused and fixed).
  root_cause_confirmed: true
  root_cause: >
    The fragment-instance DocView authored the multiline/rich-text fields (hero.summary,
    pillar.description, content-section.body, landing-page.seoDescription) as a CHILD NODE under
    `master` carrying `value`/`mimeType` attributes, e.g.
    `<summary jcr:primaryType="nt:unstructured" value="..." mimeType="text/html"/>`. This shape is
    valid JCR/XML and matches the CF Model's declared `valueType="string/multiline"` +
    `default-mime-type="text/html"` field definition closely enough to look correct on inspection, but
    it is NOT the shape AEM's real Content Fragment / GraphQL data layer reads for a `MultiFormatString`
    field. The correct shape is a PLAIN STRING PROPERTY directly on `master`, identical in form to the
    scalar text fields on the same node (e.g. `summary="..."`, `description="..."`) — the GraphQL layer
    itself synthesizes the `.html`/`.plaintext` sub-fields from that single string property, using the
    model's `default-mime-type` to interpret it as HTML.
  empirical_verification_method: >
    Verified live against the running author instance on port 4506 (admin:admin), per the dispatch's
    explicit instruction to check "what the correct fragment-instance DocView shape is." Used
    `:operation=copy` (Sling POST, no mvn) to duplicate the already-installed (still-broken)
    heroes/home-hero fragment to a scratch sibling path, reproduced the `summary:{html:null}` defect on
    the copy, then iteratively re-posted the `summary` field on the SCRATCH COPY ONLY: (1) confirmed the
    existing child-node shape reproduces `html:null` server-side (not a query artifact); (2) posted
    `summary` as a plain string property on the same scratch copy → GraphQL immediately returned
    `summary.html` populated with the exact string, and re-tested with literal `<p>...</p>` markup to
    confirm `.html` returns the markup unmodified while `.plaintext` strips it. The scratch fragment
    (heroes/scratch-copy) and an earlier mis-created scratch folder (fragments/scratch-mvtest) were both
    DELETED after the test — no scratch artifact remains on the instance or in source. A single
    additional POST/revert cycle was run directly against the real heroes/home-hero fragment's `summary`
    field to double-confirm the fix against a real fragment before immediately reverting it byte-for-byte
    back to its original (still-broken) live shape via a second POST — so the live instance's content
    state is unchanged from before this dispatch (matches the last real deploy exactly; re-verified by
    reading back `.../data/master.infinity.json` and re-running the `hero-by-path` query, both showing
