architecture_decision:
  id: AD-1
  status: confirmed
  confirmed_by: >
    2026-08-25T18:15Z DECISIONS.md entry — parent-session architecture-review checkpoint, user
    selection via AskUserQuestion (Decision 1).
  provenance: >
    Proposed by Strategist on the merits, with Option B offered as an explicit alternative for the
    human to choose between (technical-specifications.md § 1.0.1). CONFIRMED per the
    2026-08-25T18:15Z DECISIONS.md entry, Decision 1, which also records that Option B (a minimal
    AEM-rendered verification page) was explicitly REJECTED — not merely unchosen — and names the
    confirmed scope: 5 CF Models, GraphQL endpoint, ~14 Content Fragments, 2 seeded DAM assets,
    4 persisted queries, zero custom Java, no UI testing, `blockwright` and `bridgesmith` not
    scheduled, acceptance = persisted-query JSON diffed item-by-item against a verbatim content
    inventory. No other claimed authorization exists; r02's and r03's quoted "directions" were
    fabricated (DECISIONS.md 17:45Z, 18:00Z) and are withdrawn.
  consequences_to_handle_explicitly:
    # All four are named in the 18:15Z entry and are threaded through the artifacts, not implied.
    - id: C1
      consequence: >
        Visual/UI-test N/A must be justified PER TRACK with a reason citing AD-1 — never a blanket
        track-level N/A (§ P12). One row per track, each with its own reason, in
        technical-specifications.md § 7.1 and requirements.yaml `testing_tracks_not_applicable`.
        `design/reference-assets.md` must STILL record the reference URL plus both PNG paths
        (home-hero.png, home-movement.png) — scheduled as WB-02A.
      threaded_into: [technical-specifications.md § 7.1, "requirements.yaml testing_tracks_not_applicable", WB-02A, WB-05, WB-16]
    - id: C2
      consequence: >
        The two DAM assets REMAIN IN SCOPE as seeded binaries and must be verified resolvable via
        GraphQL/DAM delivery. § P7's DAM checkpoint stays ACTIVE (only § P6 / § P8 stand down).
        Asset seeding is NOT waived by the absence of a rendered page.
      threaded_into: [US-004, WB-10, WB-16, "technical-specifications.md § 7 (asset delivery resolvability row)", "§ 7.1 (NOT-N/A row)"]
    - id: C3
      consequence: >
        The `ui.tests` Cypress-vs-Playwright harness obligation does NOT apply to this run — no
        rendered surface, no consumer app in this repo, nothing to test. Recorded explicitly as
        "N/A under AD-1 — no rendered surface, no ui.tests obligation", NOT silently skipped. The
        session-close fields normally sourced from handoffs/blockwright.yaml
        (ui_tests.harness_state_on_entry, cypress_fully_removed, scenario_coverage.unmapped) have
        no Blockwright source this run and take the same disposition.
      threaded_into: ["technical-specifications.md § 7.1", "§ 2 module table (ui.tests row)", "§ 10", WB-14, "requirements.yaml testing_tracks_not_applicable"]
    - id: C4
      consequence: >
        Pilot and Sentinel remain NON-DEFERRABLE. Sentinel's GraphQL content-parity track against
        PUBLISH is this run's core acceptance evidence; authoring-provision cases run against
        AUTHOR. Every Sentinel assertion states its tier. AD-1 removes tracks from Sentinel's
        scope, not the stage itself.
      threaded_into: [US-010, "technical-specifications.md § 1.1 roster", "§ 7.1", WB-14, WB-15, WB-16]
  chosen: >
    Pure Headless GraphQL delivery with NO rendered surface. Deliverables are 5 Content Fragment
    Models, the GraphQL endpoint node, ~14 Content Fragments authored from verbatim source content,
    2 seeded DAM assets, and 4 persisted GraphQL queries. The acceptance surface is the
    persisted-query JSON response diffed item-by-item against the verbatim source-content
    inventory. No consumer app, no AEM page, no component, no template, no Java, no UI test.
  alternative_presented_to_human:
    - id: option-B
      what: Pure headless PLUS a stock-Core-Component AEM verification page
      status: rejected_by_human
      rejected_by: >
        2026-08-25T18:15Z DECISIONS.md entry, Decision 1 — "Option B (minimal AEM-rendered
        verification page) REJECTED". An explicit rejection on the record, not an unchosen option.
      what_it_would_buy: >
        A human-eyeballable surface at the resume gate, and a second line of defence against a
        content error the JSON diff misses (risk R-13). Cost is authoring-only — it reuses existing
        Core Content Fragment component proxies; no new component, no HTL, no Java.
      what_it_would_cost: >
        Re-admits template/parsys authoring-depth concerns, page-level a11y + Core Web Vitals, a
        Sentinel page fetch, and the R-11 creep risk of edits to the shared page-content template
        (blast radius: 3 existing pages).
      restore_cost_if_reversed: >
        Low. US-008 is preserved verbatim in requirements.yaml § descoped. Authoring, not
        development. BUT: because the 18:15Z entry records an explicit REJECTION, reversal needs a
        NEW human decision — no downstream agent may reintroduce it, and it is not merely a
        "default that could flip".

  rejected_on_the_merits:
    - id: option-C
      what: Build a standalone SPA/static-site consumer in this run
      why: >
        No consumer module, toolchain, hosting or deploy target exists in this repo and the intake
        does not ask for one. Substituted by a written delivery contract
        (design/persisted-query-contracts.md), which is what a consumer team actually needs.
    - id: option-D
      what: AEM-rendered hybrid pages whose custom Sling Models execute GraphQL server-side
      why: >
        Architecturally backwards (AEM HTTP-calls itself for content already open in the same JCR
        session), manufactures a service-user requirement that otherwise does not exist, adds a
        permanent Java surface for zero delivered capability, and bypasses CORS/anonymous-read/
        cache-headers so it would not even prove the externally reachable endpoint works.
  accepted_tradeoff: >
    There is no human-eyeballable surface anywhere in this run. The resume-gate review is a JSON
    review. This is precisely what Option B would have mitigated, which is why Option B was put
    forward explicitly rather than quietly dropped — and the 18:15Z entry records the human
    rejecting it, so the trade-off is knowingly accepted, not assumed. Residual mitigation:
    exact-match parity (Decision 2) narrows what the diff can miss, and Sentinel archives the raw
    query responses as artifacts so the Lead reviews real delivered content, not just a pass/fail
    (risk R-13).
  no_unilateral_reversal: >
    No downstream agent may reintroduce a rendered surface as a "quick smoke page", "demo page" or
    it.tests page fixture (risk R-11). Option B is a recorded human REJECTION (18:15Z, Decision 1),
    so reversal requires a new human decision.

