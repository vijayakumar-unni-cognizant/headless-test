    summary: >
      Any fresh Publish GET to /graphql/execute.json/headless-test/* with an Origin
      header returns HTTP 204 No Content with zero bytes. Cache-hit requests can return
      data but still omit access-control-allow-origin, so browser JavaScript cannot read
      the response cross-origin.
