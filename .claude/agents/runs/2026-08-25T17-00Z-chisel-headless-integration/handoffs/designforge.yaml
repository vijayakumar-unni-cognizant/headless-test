open_questions_for_program_agent:
  - id: DF-OQ-01
    status: RESOLVED (r02) — no longer an open question about whether verification is needed; per-item
      outcome is now recorded directly in source-content-inventory.md § 0/§§ 2-5.
    statement: >
      r01 raised this as an open question because WebFetch pipes HTML through a secondary model and
      I could not independently verify byte-exactness. That risk MATERIALIZED: the Program Agent's
      curl-based spot-check (DECISIONS.md 2026-08-26T09:00Z) found multiple r01 items were not
      character-level drift but entire fabricated sentences (e.g. SC-HOME-001's claimed page title,
      SC-HOME-002's claimed hero summary — neither exists anywhere in the raw HTML). For this r02
      revision, the Program Agent staged raw HTML for all 4 pages locally; I re-derived every one of
      the 94 items directly from those files using Grep/Read (no WebFetch call made in this pass).
    outcome: >
      Of 81 in-scope items: 67 now `verbatim (source-confirmed)` against raw HTML (either r01 was
      already right, or I substituted the real value I found at that position), 12 `partial`
      (mixed field-level confirmation — concentrated in the /platform Virtual Back Office role
      roster, where only the default-rendered tab's long description is in the static HTML), 2 fully
      `UNCERTAIN` (SC-PLAT-003, SC-PLAT-004 — no matching content found anywhere; do not author).
      Full per-item detail in source-content-inventory.md §§ 2-5; aggregate accounting in § 0.3.
    blocking: false
    affects: [WB-11, WB-16, US-003, US-010]
  - id: DF-OQ-02
    status: PARTIALLY RESOLVED (r02) — both r01 UNCERTAIN items are now resolved with direct evidence;
      new UNCERTAIN items were found elsewhere and are listed in DF-OQ-04 below, not silently added
      to this one.
    statement: >
      r01 flagged two items as UNCERTAIN. (a) /platform's Ridge/Sentry linkPath (SC-PLAT-036/037):
      RESOLVED — re-verification confirms these cards render as non-clickable <div>s, not <a> links,
      on the live page. This is now a confirmed fact (no link exists), not a pending re-verification;
      do not author a linkPath for either. (b) /community's page metadata (SC-COMM-013): RESOLVED —
      canonicalUrl, publisher, and lastUpdated are all directly confirmable via <link rel="canonical">
      and this page's own JSON-LD Organization/WebPage blocks. r01's "not returned by either fetch
      pass" was itself a WebFetch-pipeline gap (the JSON-LD block was apparently dropped in
      markdown conversion for this page specifically), not a genuine absence on the page.
    recommendation: >
      Composer may now author SC-COMM-013 in full (all fields have direct evidence) and should
      author SC-PLAT-036/037's linkPath as empty/absent as a confirmed fact, not a caveat.
    blocking: false
    affects: [WB-11, US-003]
  - id: DF-OQ-03
    status: SUPERSEDED (r02) — the underlying premise no longer holds; see replacement below.
    statement: >
      r01 asked Composer to choose between two authoring options for the home page's "connective
      idea" paragraph (SC-HOME-010). Re-verification found NO "connective idea" heading or paragraph
      exists anywhere in the raw HTML — the entire premise of this question (that this text exists
      and only its heading-boundary is ambiguous) was itself part of the confirmed fabrication. The
      real content at this position in the page (§ 2 of the corrected inventory) is a genuine h2,
      "We invest in trades businesses.", with its own real body text — there is no heading-boundary
      ambiguity to resolve because the heading is not inferred, it is a literal on-page string.
    recommendation: Superseded — author SC-HOME-010 per its corrected value directly; no choice needed.
    blocking: false
    affects: [WB-11]
  - id: DF-OQ-04
    statement: >
      NEW (r02). Two categories of genuine ambiguity were found during re-verification that did not
      exist in r01 (because r01's fabricated values papered over them): (a) two non-identical REAL
      candidate strings exist for `landing-page.seoDescription` on the home page (SC-HOME-003 vs.
      SC-HOME-003b — JSON-LD WebSite.description vs. og:description) and for the /platform "operational
      note" content-section (SC-PLAT-026 — a COO-panel closing line vs. a separate "Safety rails &
      observability" card, worded differently); (b) 9 of the 10 Virtual Back Office role-roster
      long-form descriptions (SC-PLAT-017..025) have no confirmed source at all — only their title
      and short parenthetical label are confirmed; the long description text is not present anywhere
      in the static HTML (likely client-hydrated from a JS data structure this fetch did not capture).
    recommendation: >
      For (a), Composer picks one candidate per field and records the choice in DECISIONS.md before
      authoring — do not merge two real strings into a third, blended paraphrase (this is exactly the
      pattern that produced SC-PLAT-026's original fabrication). For (b), author only title + short
      label for the 9 unconfirmed roles and leave the long description empty, or hold those 9
      fragments pending a further fetch capable of capturing client-hydrated content.
    blocking: false
    affects: [WB-11, US-003]

