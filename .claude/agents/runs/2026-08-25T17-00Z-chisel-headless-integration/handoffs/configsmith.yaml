    task: "Negative configuration decisions — recorded here for the Program Agent to add to DECISIONS.md; NOT written directly into DECISIONS.md by me"
    negative_decisions:
      - id: NEG-1
        decision: "No service user, no repoinit entry, no ServiceUserMapperImpl.amended.cfg.json for this run's GraphQL delivery surface."
        reasoning: >
          AD-5 (confirmed architecture, zero custom Java): there is no Sling Model, servlet, or any
          Java code that needs a service-bound ResourceResolver. The Core CF/GraphQL delivery path
          uses the requesting client's own (anonymous, on publish) resolver, not a service user.
