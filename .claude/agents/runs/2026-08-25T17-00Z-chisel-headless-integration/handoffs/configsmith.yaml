          per AEMaaCS defaults — no new ACL grant is required to make it so. Verified by reading the
          existing RepositoryInitializer~headless-test.cfg.json: it contains only archetype-default
          path/property setup for /content/dam/headless-test, no service-user or ACL script, and
          I have added nothing to it (additive-only policy honored by making no edit at all).
        repo_verification: >
          Read ui.config/.../config/org.apache.sling.jcr.repoinit.RepositoryInitializer~headless-test.cfg.json
          directly — confirms no service user / ACL script exists there today, and none was added.
        recommended_DECISIONS.md_wording: >
          "WB-08 (configsmith) — NO service user / repoinit entry added for the GraphQL delivery
          surface. AD-5 (zero custom Java) means the Core CF/GraphQL servlet uses the requesting
          client's own resolver, not a service-bound one; DAM content under
          /content/dam/headless-test/chisel/ relies on AEMaaCS's default anonymous-read grant on
          publish, not a new ACL. This is a recorded decision, not an omission — confirmed against
          the existing RepositoryInitializer~headless-test.cfg.json, which was read and left
          unmodified."

      - id: NEG-2
        decision: >
          Did NOT ship com.adobe.cq.dam.cfm.graphql.cf.GraphQlServlet OSGi config on any tier.
        reasoning: >
          This PID has no ~name suffix, so it is instance-wide, not per-project. Shipping it would
          set enable.get/enable.post/enable.ui for every team on a possibly-shared AEM instance —
          a real risk of silently flipping another team's GraphiQL/POST settings, not a
          hypothetical one. Adobe's per-tier defaults already disable ad-hoc POST + GraphiQL on
          publish, which is the security posture this run needs (anonymous GET via persisted
          queries only). Open as Q-001 in requirements.yaml for the Lead to confirm dedicated vs.
          shared environment; until answered, the safe default (do not ship) applies.
        repo_verification: >
          Grepped ui.config/src for "GraphQlServlet" — zero matches. Confirms the singleton was
          never introduced by any prior stage of this run, not merely that I chose not to add it.
        recommended_DECISIONS.md_wording: >
          "WB-08 (configsmith) — did NOT ship the instance-wide singleton OSGi config
          com.adobe.cq.dam.cfm.graphql.cf.GraphQlServlet on any tier (config / config.author /
          config.publish). It has no ~name suffix, so shipping it would set enable.get/post/ui for
          the entire AEM instance, not just this project — verified absent from the repo by grep.
          Open question Q-001 (dedicated vs. shared target environment) remains with the Lead;
          the safe default (rely on Adobe's per-tier defaults) applies until answered."

      - id: NEG-3
        decision: "No dispatcher/ module scaffolded; no dispatcher or CDN cache-rule authored for /graphql/execute.json/*."
        reasoning: >
          The dispatcher/ module does not exist in this repo (confirmed by directory listing — no
          top-level dispatcher folder). Scaffolding one from scratch is out of scope for this run
          per Q-002's recorded default (rely on AEMaaCS CDN defaults). Cache-posture consequence,
          stated explicitly rather than left as a silent gap: Sentinel (WB-16) will measure and
          report the OBSERVED Cache-Control header on /graphql/execute.json/headless-test/... against
          the real environment and treat a missing/absent header as a FINDING with a concrete
          remediation recommendation (add a dispatcher module with a cache rule allowing
          /graphql/execute.json/* and a Cache-Control response header, or an equivalent CDN rule in
          cdn.yaml) — not as a silent pass and not as an automatic build failure.
        repo_verification: >
          Directory listing of the repo root confirms no dispatcher/ folder exists.
        recommended_DECISIONS.md_wording: >
          "WB-08 (configsmith) — no dispatcher/ module scaffolded this run (module absent from the
          repo; confirmed by directory listing). Q-002's recorded default applies: rely on AEMaaCS
          CDN defaults for /graphql/execute.json/*. Cache-posture consequence carried forward
          explicitly to Sentinel (WB-16): the real environment's observed Cache-Control header on
          the persisted-query execution path will be measured and, if absent, reported as a finding
          with a concrete remediation (dispatcher module or CDN rule), not silently passed."

