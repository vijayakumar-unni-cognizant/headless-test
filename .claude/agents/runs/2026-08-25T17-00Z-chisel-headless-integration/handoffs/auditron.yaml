      undefined..."}]}. GET /content/cq:graphql/headless-test/endpoint.schemaerrors (TC-029's own
      stated URL, checked for the first time this dispatch) -> non-empty:
      [{"errorType":"SCHEMA_INCOMPLETE_FIELD_REMOVED","errorLocation":".../landing-page@hero",
      "errorMessage":"...has been removed from Schema. Cause: Missing nested model(s) ''"}]. Live
      introspection confirms `hero` absent from LandingPageModel's field list while stats/sections/
      pillars (the model's other 3 reference fields) are all present. Confirmed deterministic
      regardless of the `path` argument (invalid path and missing $path both reproduce the identical
      error) -- a static schema defect, not per-instance.
    cause: >
      SUPERSEDED AND WRONG — retained for the record. This paragraph guessed "a version-specific AEM
      SDK behavior or an undocumented required property". The ACTUAL root cause, established
      2026-08-26T15:30Z: valueType="string/content-fragment" is simply NOT RECOGNISED by the
      CF-Model-to-GraphQL schema generator, so the field is dropped from the generated type. The
      paragraph's premise -- "authored exactly per the create-content-fragment-graphql skill's
      documented single-fragment-reference pattern" -- was true, AND THAT REFERENCE IS ITSELF WRONG.
      Correct value: valueType="string/reference" (produces a Reference UNION, which is what the
      query's "... on HeroModel" spread needs).
    resolution: >
      RESOLVED 2026-08-26T15:30Z as GQL-FIX-01. One attribute changed in
