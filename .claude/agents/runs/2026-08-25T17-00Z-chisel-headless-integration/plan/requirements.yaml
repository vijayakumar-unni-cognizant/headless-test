constraints:
  - AEM as a Cloud Service only. No AMS / on-prem / 6.5 pattern.
  - Project identifiers are fixed: project `headless-test`, package `com.headlesstest.aem`,
    group `Headless Test`. Use verbatim.
  - Default git branch is **`main`**, NOT `master`. Pilot's PR must target `main`.
  - Core Components 2.28.0 (pom.xml `core.wcm.components.version`). Only v2/v3 Core Components
    already proxied under /apps/headless-test/components may be used.
  - No `dispatcher/` module exists in this repo (modules: all, core, it.tests, ui.apps,
    ui.apps.structure, ui.config, ui.content, ui.tests).
  - VERIFIED GAP — ui.content filter.xml `/content/dam/headless-test` filter excludes all
    children except jcr:content. New DAM assets and fragments will NOT ship without a new filter
    root.
  - VERIFIED GAP — the existing `CORSPolicyImpl~headless-test` config is `config.author` only and
    scopes to `/(content|conf)/headless-test.*`, which matches neither
    `/graphql/execute.json/...` nor `/content/_cq_graphql/...`.
  - `mode="merge"` FileVault filters do not re-seed changed content over an existing node.
  - Persisted queries MUST be `persistentQueries` binary nodes. A `persistedQueries/*.json` file
    deploys a node the GraphQL servlet ignores.
  - CF Models are mutable content owned by authors after first deploy — the JCR form in
    ui.content is a seed, and field renames/deletions are breaking changes for consumers.
  - No new component, no new template, no new template type, no clientlib change, no new Java
    class, no new service user, and no authored page. `ui.apps`, `ui.frontend`, `core`, `it.tests`
    and `ui.tests` are untouched by this run.
  - The existing template /conf/headless-test/settings/wcm/templates/page-content and the existing
    /content/headless-test page tree must be left exactly as they are — no page is authored and no
    template `structure/` is modified.
  - Sentinel's real-environment target is the persisted-query endpoint
    (`/graphql/execute.json/headless-test/<name>`) on the publish tier. No page URL is validated,
    because none is produced.
  - No secrets, tokens, or real-environment URLs committed to the repository.
