goals:
  # The "zero rendered surface" goal below encodes AD-1. AD-1 was my recommendation and is
  # CONFIRMED per the 2026-08-25T18:15Z DECISIONS.md entry (parent-session architecture-review
  # checkpoint, user selection via AskUserQuestion). The alternative I raised — Option B, pure
  # headless PLUS a stock-Core-Component AEM verification page — was REJECTED in that same entry.
  # Option B is retained in technical-specifications.md § 1.0.1 so the choice stays visible and the
  # cost of reversal is known; reversal is the human's call, never an agent's.
  - Deliver a working AEM as a Cloud Service **Pure Headless** content-delivery capability for the
    Chisel reference content: Content Fragment Models, Content Fragments, a GraphQL endpoint, and
    persisted GraphQL queries that a decoupled consumer can call.
  - Make the delivery contract explicit and testable — a documented persisted-query contract
    (name, GraphQL text, JSON response shape, matrix parameters, isolation scope) that a future
    front-end consumer can build against without reading AEM internals.
  - Ground every field in the content model in a real, observed region of the reference source —
    no speculative fields, no invented copy.
  - Ship with **zero custom Java, zero custom components, zero custom HTL, and zero rendered
    surface** — no AEM-rendered page, no consumer application, no presentation layer of any kind.
    The delivered artifact is the content model plus the queryable payload.
  - Deploy reproducibly from source: models, fragments, assets, endpoint and persisted queries all
    package in `ui.content` / `ui.config` and resolve immediately after install, with no manual
    post-deploy step in AEM's UI.

personas:
  - id: P1
    name: Headless Content Author
    description: Authors and maintains Content Fragments in the AEM Assets CF editor. Does not write code.
  - id: P2
    name: Consumer Front-End Developer
    description: >
      Builds the decoupled consumer (SPA / static site / native app) that calls the AEM GraphQL
      persisted-query endpoints. Is NOT building inside this repo in this run.
  - id: P3
    name: AEM Platform Engineer
    description: Owns OSGi config, CORS, caching, service users, deployability of the content package.
  - id: P4
    name: Delivery Lead / Reviewer
    description: Reviews and merges the PR, deploys to the real environment, accepts the outcome.

