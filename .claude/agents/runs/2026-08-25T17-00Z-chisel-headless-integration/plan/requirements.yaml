  # Q-001, Q-002, Q-003, Q-004, Q-006 and Q-007 are non-blocking and proceed on their recorded
  # defaults, remaining open for a human to override at any later checkpoint.

  - id: Q-001
    statement: >
      Is the target real environment dedicated to this project, or shared with other teams? This
      determines whether the instance-wide singleton OSGi config
      `com.adobe.cq.dam.cfm.graphql.cf.GraphQlServlet` may be shipped to control
      enable.get/post/ui. DEFAULT: do NOT ship it — it would silently change GraphiQL and ad-hoc
      POST behaviour for every team on the instance. Adobe's per-tier defaults are relied on.
    blocking: false
    affects: [US-013]

  - id: Q-002
    statement: >
      Should a `dispatcher/` module be scaffolded so `/graphql/execute.json/*` gets explicit
      allow + cache rules? The module does not exist in this repo. DEFAULT: no — rely on AEMaaCS
      CDN defaults for this run; Sentinel measures and reports the observed `Cache-Control`
      header, and a missing header becomes a finding with a concrete remediation rather than a
      silent pass.
    blocking: false
    affects: [US-007]

  - id: Q-003
    statement: >
      Which stack will the eventual consumer use (React/Next, Vue, native mobile, server-side
      renderer)? Affects only the example snippets in design/persisted-query-contracts.md, not any
      AEM deliverable. DEFAULT: write the contract stack-agnostically (plain `fetch` + JSON).
    blocking: false
    affects: [US-014]

  - id: Q-004
    statement: >
      Multi-valued fragment-reference authoring trade-off on the `landing-page` model. Option A
      (`valueType="string/content-fragment[]"` + `.../fragmentreference/multifield`) gives authors
      a real "add more" multifield but CANNOT be hand-authored in JCR — the CF Model Editor writes
      a target-model link no plain property reproduces, so a JCR-only version is dropped from the
      schema with `SCHEMA_INCOMPLETE_FIELD_REMOVED`. Option B (`valueType="string/reference[]"`
      with the single-picker resource type) is fully JCR-authorable and deploys with zero rework,
      but authors get a single path-picker instead of a multifield. DEFAULT: Option B — this run's
      priority is a reproducible zero-manual-step deploy. Confirm authors accept the degraded
      picker, or accept a documented post-deploy CF-Model-Editor step to upgrade to Option A.
    blocking: false
    affects: [US-001, US-005]

  - id: Q-006
    statement: >
      Confirm it is acceptable to commit ~2.4 MB of PNG binaries (784 KB + 1,622 KB) into
      ui.content so the DAM seed is reproducible from source. DEFAULT: yes — the archetype
      already ships a sample binary (asset.jpg), and the alternative (runtime upload via the
      Assets HTTP API) introduces a manual step that breaks the zero-manual-step deploy goal.
      If rejected, US-004 becomes a documented manual upload step and Sentinel verifies the
      assets exist rather than that they deployed.
    blocking: false
    affects: [US-004]

  - id: Q-007
    statement: >
      Which real-environment URL will Sentinel target, and what is its auth mode? Required at the
      resume gate, not now. The Lead records it in DECISIONS.md after the manual deploy. Sentinel
      must NOT be pointed at http://localhost:4502 or an RDE.
    blocking: false
    affects: [US-010]

