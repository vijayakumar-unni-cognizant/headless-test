    candidate_agents: [designforge]

nfr:
  performance:
    lcp_ms_target: null           # N/A — no rendered surface in scope (AD-1)
    inp_ms_target: null           # N/A — no rendered surface in scope
    cls_target: null              # N/A — no rendered surface in scope
    ttfb_ms_target: 600           # applies to GET /graphql/execute.json/... origin response
    graphql_p75_uncached_ms_target: 800   # GET /graphql/execute.json/... origin response, p75
    graphql_p75_cached_ms_target: 200     # same, CDN/dispatcher-cached
    payload_kb_soft_ceiling: 150          # landing-page-by-path JSON response
    note: >
      There is no rendered surface in this run, so Core Web Vitals (LCP/INP/CLS) are not
      measurable and are explicitly N/A — Sentinel must not report them as failures or gaps.
      The ONLY performance surface is the persisted-query HTTP response: latency, payload size,
      and cacheability.
  security:
    - Delivery is anonymous read-only. No authenticated or personalised query in scope.
    - CORS is an explicit origin allow-list; never `.*`; `supportscredentials` false.
    - Ad-hoc POST queries and schema introspection must not be enabled on publish. Rely on Adobe's
      per-tier defaults; do NOT ship the instance-wide GraphQlServlet singleton config (US-013).
    - No secrets, PII, pricing entitlements or unpublished commercial terms in Content Fragments —
      any service user with jcr:read on the DAM path can read them.
    - No new service user, no new ACL grant, no repoinit change (US-013).
    - No credentials, tokens or environment URLs committed to the repo.
  accessibility: WCAG-2.1-AA
  accessibility_notes:
    - >
      In a headless payload the accessibility obligation shifts INTO the data: alt text must be
      present in the GraphQL response, because there is no AEM-rendered <img> for a later fix to
      catch. Every asset-reference field must be paired with authored alt/description text
      (US-004) and the query must expose it.
    - Rich-text (`MultiFormatString`) `html` output must be semantic (headings, lists, links) and
      must not carry inline presentational styling that a consumer cannot override.
    - No rendered-surface a11y checks apply (no page, no DOM, no contrast, no heading order).
      WCAG conformance in this run means the PAYLOAD carries what a conformant consumer needs.
  seo:
    - Not a deliverable of this run. Pure-headless delivery produces JSON; SEO is owned by
      whatever consumer renders it.
    - `landing-page` carries `seoTitle` and `seoDescription` fields so a future consumer can emit
      correct metadata — the data obligation is met even though the rendering is out of scope.
    - No indexable AEM surface is produced, so there is no crawl, canonical, or sitemap concern.
  browsers:
